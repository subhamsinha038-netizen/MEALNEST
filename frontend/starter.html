<!DOCTYPE html>
<html>
<head>
  <title>MEALNEST-Order your favourite food</title>
  <link rel="stylesheet" href="RESTAURANTS.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="#" class="logo">
    <div class="logo-icon">🍜</div>
    <span class="logo-text">Meal<span>Nest</span></span>
  </a>
  <div>
    <button id="authButtons" onclick="goToLogin()">Login</button>
    <button id="authButtons" onclick="goToRegister()">Register</button>
  </div>
    
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-bg">
    <img class="hero-img" src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600&q=80" alt="food"/>
    <img class="hero-img" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&q=80" alt="food"/>
    <img class="hero-img" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&q=80" alt="food"/>
  </div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-tag">🔥 200+ restaurants near you</div>
    <h1 class="hero-title">Discover the best<br><span>food & drinks</span></h1>
    <p class="hero-sub">Order from your favourite restaurants — fast delivery, every time.</p>
    <div class="search-bar">
      <span class="search-icon">
        <svg width="18" height="18" fill="none" stroke="#9C8777" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input type="text" placeholder="Search for restaurants..." id="searchInput"/>
      <button class="search-btn" onclick="searchRestaurants()">🔍 Search</button>
    </div>
  </div>

  <div class="hero-stats">
    <div class="stat">
      <div class="stat-num">200+</div>
      <div class="stat-label">Restaurants</div>
    </div>
    <div class="stat">
      <div class="stat-num">30 min</div>
      <div class="stat-label">Avg Delivery</div>
    </div>
    <div class="stat">
      <div class="stat-num">4.8★</div>
      <div class="stat-label">Avg Rating</div>
    </div>
  </div>
</div>

<h2 class="section-title">Popular Restaurants</h2>
<div id="restaurantList" class="restaurant-grid"></div>

<script src="script.js"></script>
<script>
  loadRestaurants();
</script>

</body>
</html>
